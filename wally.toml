[package]
name = "coffilhg/coffeeobjects"
description = "CoffeeFolder and CoffeeBaseValue Class implementation for parity with most important methods/properties of Roblox' Folder and BaseValue Instances"
version = "2.2.2"
license = "Apache-2.0"
authors = ["Coffilhg <coffilhg@gmail.com>"]
repository = "https://github.com/Coffilhg/Useful-Modules/tree/CoffeeObjects"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

exclude = ["src/**/*", "!src/init.lua*"]

[dependencies]
CoffeeParser = "coffilhg/coffeeparser@1.0.2"
PerfectSignal = "coffilhg/perfectsignal@1.0.1"
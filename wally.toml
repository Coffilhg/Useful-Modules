[package]
name = "coffilhg/namespacesync"
description = "This module is a great utility if you need 'singletone' Instances, e.g. your Client and Server modules need a shared folder for their Project state or your custom Plugin should always output in a predictable place."
version = "0.0.1"
license = "MPL-2.0"
authors = ["Coffilhg <coffilhg@gmail.com>"]
repository = "https://github.com/Coffilhg/Useful-Modules/tree/NamespaceSync"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
LemonSignal = "data-oriented-house/lemonsignal@2.0.0"
ClassNameTypePairs = "coffilhg/classnametypepairs@*"